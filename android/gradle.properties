org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 命令行 Gradle 默认会走 Java 8；指定 17 后依赖才能解析（路径按本机修改）
org.gradle.java.home=E:/opt/jdk/ms-17.0.15
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# 项目路径含中文「外包」时，Windows 上需跳过 AGP 路径检查
android.overridePathCheck=true

# 依赖与插件走阿里云 Maven（见 settings.gradle）
# Gradle 安装包见 gradle/wrapper/gradle-wrapper.properties
#
# 若 okhttp3 / okio 在 IDE 里 Unresolved：先确认 Gradle JDK 为 11+（与 local.properties 里 org.gradle.java.home 一致），再 Sync。
